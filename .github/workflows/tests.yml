name: tests

# Runs the asserted testthat suite (tests/testthat.R) plus the legacy
# console-check scripts (tests/test_*.R) on every push and pull request, so
# a wrong chemistry-dictionary formula or a broken mass calculation fails
# the build instead of only failing quietly in someone's local console.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: Run testthat suite
        run: Rscript tests/testthat.R

      - name: Run legacy console-check scripts
        run: |
          set -e
          for f in tests/test_*.R; do
            echo "=== $f ==="
            Rscript "$f"
          done
